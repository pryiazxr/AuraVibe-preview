
name: Deploy AuraVibe Preview

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aura-vibe-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Checkout AuraVibe develop branch
        uses: actions/checkout@v4
        with:
          repository: pryiazxr/AuraVibe
          ref: develop
          path: source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Typecheck
        working-directory: source
        run: npm run typecheck

      - name: Run tests
        working-directory: source
        run: npm test

      - name: Build preview
        working-directory: source
        run: npm run build -- --base=/AuraVibe-preview/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Configure SPA fallback
        working-directory: source
        run: |
          if [ -f dist/404.html ]; then
            sed -i 's/var pathSegmentsToKeep = 0;/var pathSegmentsToKeep = 1;/' dist/404.html
          fi
          rm -f dist/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
        
